# iOS unit-test workflow.
#
# Runs the full `PomoDuoTests` suite on a macOS runner against the
# same iPhone 17 / iOS 26.4 simulator the local workflow targets.
# A single-runner job (no matrix, no UI-test target) keeps macOS
# minute consumption low while still catching:
#
#   - Swift compile regressions
#   - Contract-parity drift between `UsernameNormalizer` / `PairCode`
#     and the backend regex (which is verified independently in the
#     backend contract-test workflow — the two together form the
#     cross-repo parity net).
#   - Any other PomoDuoTests regression (runtime-health, Screen Time
#     mapper, session/paired flows, deep-link router, etc.).
#
# To disable this workflow temporarily without deleting it (e.g.,
# if macOS minutes become a concern), set the repo's Actions
# `workflow_dispatch: on` and comment out the `push`/`pull_request`
# triggers. The file stays checked in for easy re-enable.

name: iOS Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: xcodebuild test (PomoDuoTests)
    # `macos-latest` currently pins to the newest macOS runner image
    # GitHub ships with Xcode pre-installed. Upgrade to a
    # version-pinned `macos-15`/`macos-14` label only if Apple
    # changes the default Xcode on `macos-latest` to one that no
    # longer supports this project's iOS 26 deployment target.
    runs-on: macos-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: PomoDuo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Resolving Swift Package Manager dependencies (Firebase iOS
      # SDK, GoogleUtilities, abseil, etc.) is the slowest single
      # step of a cold run. Caching the resolved packages by
      # Package.resolved hash makes warm PRs much faster.
      - name: Cache Swift Package Manager
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Show Xcode version
        # Logged for diagnostic clarity when a future macOS runner
        # upgrade changes the default Xcode toolchain.
        run: xcodebuild -version

      - name: Run PomoDuoTests
        # Plain `xcodebuild` (not piped through a prettifier) so the
        # workflow has no implicit tooling dependency on the runner
        # image. The output is verbose but searchable; failures
        # surface at the top via GitHub's built-in log-error
        # detection.
        run: |
          xcodebuild test \
            -scheme PomoDuoTests \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -skipPackagePluginValidation
